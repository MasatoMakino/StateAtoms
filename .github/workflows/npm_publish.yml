name: Publish to NPM
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag points to the checked-out commit
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points to $TAG_SHA, not $GITHUB_SHA"
            exit 1
          fi
      - name: Verify the commit is on the default branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH"
            exit 1
          fi
      - name: Verify the tag matches the package.json version
        run: |
          VERSION=$(jq -r .version package.json)
          # npm publish without --tag marks a prerelease as latest.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not in X.Y.Z format"
            exit 1
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  # Only this job can mint an OIDC token, and it runs no dependency code.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Publish package on NPM 📦
        run: npm publish ./*.tgz --access public
